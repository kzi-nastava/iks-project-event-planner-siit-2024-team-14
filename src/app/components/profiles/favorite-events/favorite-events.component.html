<div class="events-list-section">
  <div class="header-bar">
    <h2 class="header-title">Favorite Events</h2>
  </div>

  <div *ngIf="favoriteEvents.length === 0" class="no-events">
    <p>You have no favorite events yet.</p>
  </div>

  <div class="events-list">
    <div *ngFor="let event of favoriteEvents" class="event-card">
      <div class="event-header">
        <div class="event-avatar">
          <span>{{ getInitials(event.organizer?.name || 'Organizer') }}</span>
        </div>
        <div class="event-details">
          <h3>{{ event.organizer?.name || 'Unknown Organizer' }}</h3>
          <p>Event Organizer</p>
        </div>
      </div>

      <img [src]="getPhotoUrl(event.id)" alt="Event photo" class="event-image" />

      <div class="event-content">
        <h4>{{ event.name }}</h4>
        <p>{{ event.description }}</p>
        <small>
          <span class="fas fa-location-pin"></span> {{ event.location }}
        </small>
        <br />
        <small>
          <span class="fas fa-calendar-alt"></span> {{ event.startDate | date:'mediumDate' }}
        </small>
        <br /><br />
        <button class="view-more-btn" (click)="openEvent(event.id)">View More</button>
      </div>
    </div>
  </div>
</div>
